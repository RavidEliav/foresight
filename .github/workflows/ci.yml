name: CI

# Test gates 1 and 3: every PR into dev, and the dev -> main release PR.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOCK_LLM: "true"
      FORESIGHT_SKIP_DOTENV: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      RUN_PASSCODE: ci-passcode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit, integration and app tests
        run: pytest

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start app (mocked LLM)
        run: |
          streamlit run app/streamlit_app.py --server.port 8501 --server.headless true &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          echo "App did not become healthy" && exit 1

      - name: Smoke and Playwright E2E tests
        env:
          BASE_URL: http://localhost:8501
        run: >
          pytest tests/smoke tests/e2e
          --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
