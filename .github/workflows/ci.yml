name: CI

# Test gates 1 and 3: every PR into dev, and the dev -> main release PR.
# Also runs on pushes to dev/main so Railway's "Wait for CI" only deploys merged
# commits that passed.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Throwaway Postgres with pgvector (same major version as Supabase) for the registry tests
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      MOCK_LLM: "true"
      FORESIGHT_SKIP_DOTENV: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      RUN_PASSCODE: ci-passcode
      FORESIGHT_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # One embedding-model cache for the tests and the app under test (RAG, §18)
      FORESIGHT_MODELS_DIR: /home/runner/.cache/foresight/models
      FORESIGHT_TEST_MODELS_DIR: /home/runner/.cache/foresight/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache the embedding model (all-MiniLM-L6-v2, ONNX)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/foresight/models
          key: minilm-onnx-v1-${{ hashFiles('knowledge/*.md', 'config/settings.yaml') }}
          restore-keys: minilm-onnx-v1-

      - name: Lint
        run: ruff check .

      - name: Unit, integration and app tests
        run: pytest

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # E6 runs the whole pipeline on the real SECOM data: keep the download between CI runs
      - name: Cache SECOM data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: secom-uci-179-v1

      - name: Start app (mocked LLM, fast settings)
        env:
          FORESIGHT_CONFIG: tests/fast_settings.yaml
        run: |
          streamlit run app/streamlit_app.py --server.port 8501 --server.headless true &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          echo "App did not become healthy" && exit 1

      - name: Smoke and Playwright E2E tests (E1-E7)
        env:
          BASE_URL: http://localhost:8501
        run: >
          pytest tests/smoke tests/e2e
          --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
