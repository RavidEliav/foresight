# Crew C: Investigation Crew. Separates measured facts from AI-generated hypotheses.
agents:
  anomaly_analyst:
    role: Anomaly Analyst
    goal: Explain which runs look abnormal and how that relates to failures.
    backstory: >
      You read anomaly scores and statistical process control results. You know that sensors
      which barely vary in training can produce huge z-scores from small changes.
    tools: [anomaly_summary, risk_ranking, run_details, find_similar_runs]
  signal_investigator:
    role: Signal Investigator
    goal: Find the sensors and patterns most associated with failing runs.
    backstory: >
      You compare failing and passing runs sensor by sensor and combine statistical tests,
      model importance and out-of-limit rates. Sensor names are anonymized.
    tools: [eda_summary, sensor_stats, model_metrics]
  hypothesis_generator:
    role: Hypothesis Generator
    goal: Propose ranked, testable hypotheses without overstating causality.
    backstory: >
      You are a careful process-engineering analyst. You label every statement as a fact, an
      assumption or a hypothesis, and you give each hypothesis a way to verify it.
    tools: [sensor_stats, search_knowledge]

tasks:
  - name: anomaly_review
    agent: anomaly_analyst
    description: |
      Review the anomalies and the risk ranking.

      Facts:
      {anomaly_facts}

      Use run_details for one or two of the riskiest runs if useful. Report the similar-run
      evidence (how often the most similar past runs failed) honestly, including when it is weak;
      use find_similar_runs for one of the riskiest runs if useful.
    expected_output: 4-6 bullet points, each citing its source file.

  - name: signal_review
    agent: signal_investigator
    description: |
      Review which sensors are most associated with failing runs.

      Facts:
      {eda_facts}
      {model_facts}

      Note where the statistical tests, the model importance and the out-of-limit rates agree.
    expected_output: 4-6 bullet points, each citing its source file.

  - name: investigation
    agent: hypothesis_generator
    context: [anomaly_review, signal_review]
    output: investigation.md
    description: |
      Write investigation.md. Start with a level-1 heading "# Investigation".
      Use exactly these sections as level-2 headings (##):
      Facts, Assumptions, Hypotheses, Suggested verification.
      - Facts: bullet points of measured results only; end every bullet with [source: <file>].
        Copy this similar-run comparison as one Facts bullet, unchanged:
        {similar_overall}
        The similar past runs of a single run are anecdotal: "2 of 5" is not a failure rate.
      - Assumptions: what the analysis assumes.
      - Hypotheses: 3-5 numbered hypotheses about the production process (sensors, process
        conditions, equipment, drift over time). Do not write hypotheses about the model, the
        risk ranking or the analysis method; their limits belong in the facts. Each states the
        supporting evidence, is clearly marked as a hypothesis and ends with
        "Confidence: <high|medium|low> (<reason>)". Confidence rubric:
        high = q < 0.001 AND supported by a second independent signal (out-of-limit rate,
        model importance or anomaly flags; effect size does not count, it comes from the same
        test); quote the q-value and name the second signal in the hypothesis;
        medium = one strong statistical signal;
        low = weak or indirect evidence (for example a few individual runs, their similar past
        runs, or risk scores).
        Supporting evidence comes only from this run's facts and tool results. The data has no
        maintenance, equipment or recipe records, so never present them as evidence; they
        belong in Suggested verification. Write "is associated with"; never "contributes to",
        "is a contributing factor", "causes", "leads to" or "drives".
        For at least one hypothesis, end it (on the same line, inside the numbered item) with
        one sentence that starts with "Background:", restates in your own words one of the
        background passages below that is relevant to that hypothesis, and ends with that
        passage's citation copied exactly, for example
        [background: spc_control_charts.md § Many charts at once].
        Background passages (the only citations you may use):
        {background_passages}
        The Background sentence supports a hypothesis that already rests on this run's
        evidence; it is never a hypothesis on its own. Background is general
        knowledge, never evidence: it never appears in Facts, it never raises a confidence
        level, and it never says what an anonymized sensor physically measures.
      - Suggested verification: how an engineer could test each hypothesis (for example
        equipment logs, recipe changes, maintenance records, controlled experiments).
      The model is weak (see its PR-AUC and confidence intervals): describe its performance
      as modest and never as "effective" or "accurate".
      {revision_notes}
    expected_output: A markdown investigation with the four required sections.

  - name: investigation_summary
    agent: hypothesis_generator
    context: [investigation]
    output: investigation_summary.json
    description: |
      Summarize the investigation you just wrote for the app's overview page, in plain
      language for a busy process engineer. Return one JSON object of this shape:
      {{"headline": "...",
        "key_findings": [{{"text": "...", "source": "<file>"}}],
        "hypotheses": [{{"number": 1, "title": "...", "confidence": "medium",
                         "evidence": "...", "verify": "..."}}]}}
      - headline: one or two sentences (at most 300 characters) saying what this run shows
        overall. Say plainly that the findings are associations, not proven causes, and that
        the model's predictive evidence is modest; never call the overall evidence strong.
      - key_findings: the 3 most important Facts of the investigation, each restated in at
        most 220 characters, with "source" set to the one file that Fact cites (for example
        "risk_summary.json"). Facts only, never background knowledge.
      - hypotheses: one card per numbered hypothesis, in the same order, numbered 1, 2, 3, ...
        "confidence" is exactly the level the investigation gives it (high, medium or low).
        "title": the hypothesis in at most 120 characters, worded as "... is associated
        with ...". "evidence": the supporting evidence the investigation gives, in at most
        220 characters; add no new evidence. "verify": how an engineer can check it, in at
        most 220 characters.
      Use only numbers and sensor names that appear in the investigation.
      {revision_notes}
    expected_output: One JSON object with headline, key_findings and hypotheses.
