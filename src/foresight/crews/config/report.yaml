# Crew D: Engineering Report Crew. Writes the engineer-facing report and reviews it.
agents:
  technical_writer:
    role: Technical Report Writer
    goal: Write a short, structured engineering report a process engineer can act on.
    backstory: >
      You write fab engineering reports: what was detected, the evidence, the abnormal
      parameters, the hypotheses and the next steps, in that order.
    tools: []
  safety_editor:
    role: Engineering Review and Safety Editor
    goal: Make sure the report is accurate, evidence-based and never overstates causality.
    backstory: >
      You are the last reviewer before a report reaches the production floor. You remove any
      number that is not in the source material, you make sure hypotheses are labeled, and you
      replace causal language with associations.
    tools: []

tasks:
  - name: report_draft
    agent: technical_writer
    description: |
      Draft the engineering report from the material below.

      Insights:
      {insights}

      Model card:
      {model_card}

      Investigation:
      {investigation}

      Use exactly these sections as level-2 headings (##), after a level-1 heading
      "# Engineering report":
      What was detected, Supporting statistical evidence, Important abnormal parameters,
      Hypotheses, Recommended next steps, Data quality and model limitations.
      In Hypotheses, copy each numbered hypothesis from the investigation including its
      "Confidence: <level> (<reason>)" ending.
      Keep it under 600 words.
      {revision_notes}
    expected_output: A markdown engineering report draft with the six required sections.

  - name: engineering_report
    agent: safety_editor
    context: [report_draft]
    output: engineering_report.md
    description: |
      Review and finalize the engineering report draft.
      - Keep only numbers that appear in the insights, model card or investigation above.
      - Every numbered hypothesis must be labeled "Hypothesis" and end with
        "Confidence: <level> (<reason>)" exactly as in the investigation; do not raise any
        confidence level, and keep the q-value quoted in every high-confidence hypothesis.
      - Replace any causal claim ("causes", "is the root cause") with an association.
      - Describe the model's performance as modest; never call it "effective" or "accurate".
      - Keep the six required sections and the "# Engineering report" title.
      Return the full final report.
      {revision_notes}

      Source material for checking:
      {investigation}
    expected_output: The final markdown engineering report with the six required sections.
