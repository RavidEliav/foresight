# Fast settings for tests (FORESIGHT_CONFIG). Same structure as config/settings.yaml.
seed: 42

llm:
  model: gpt-4o-mini
  temperature: 0

data:
  max_missing_ratio: 0.5
  min_rows: 100
  expected_fail_rate: [0.02, 0.2]

analytics:
  test_fraction: 0.25
  cv_folds: 3
  corr_threshold: 0.98
  select_k: 10
  rf_trees: 20
  bootstrap_samples: 50
  permutation_top_n: 5
  permutation_repeats: 2
  min_fails_train: 2
  min_fails_test: 1
  alarm_budget: 0.10
  anomaly_quantile: 0.95
  z_limit: 3.0
  top_features: 5

paths:
  runs_dir: runs
  logs_dir: logs
  reference_run_dir: artifacts/reference
  data_raw_dir: data/raw
  contract_path: config/dataset_contract.json
  knowledge_dir: knowledge
  models_dir: runs/.models
